services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: mental_care_db
    environment:
      POSTGRES_DB: mental_health_app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql
    restart: unless-stopped
